name: Try Runtime (PR)

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number for result comments
        required: true
        type: string
      target_sha:
        description: Commit SHA to test
        required: true
        type: string
      disable_spec_version_check:
        description: Disable the spec-version check
        default: false
        required: false
        type: boolean
      disable_idempotency_checks:
        description: Disable idempotency checks
        default: false
        required: false
        type: boolean

permissions: {}

concurrency:
  group: pr-${{ inputs.pr_number || github.event.pull_request.number }}-try-runtime
  cancel-in-progress: true

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  try-runtime:
    if: >
      inputs.pr_number != '' ||
      contains(github.event.pull_request.labels.*.name, 'try-runtime')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - name: darwinia-runtime
            uri: wss://rpc.darwinia.network
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha }}

    steps:
      - name: Checkout requested code (unprivileged)
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Resolve flags
        id: flags
        env:
          CALL_DISABLE_IDEMP: ${{ inputs.disable_idempotency_checks }}
          CALL_DISABLE_SPEC: ${{ inputs.disable_spec_version_check }}
          CALL_PR_NUMBER: ${{ inputs.pr_number }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if [[ -n "$CALL_PR_NUMBER" ]]; then
            spec="$CALL_DISABLE_SPEC"
            idemp="$CALL_DISABLE_IDEMP"
          else
            spec=false
            idemp=false
            if grep -q 'try-runtime:skip-spec-check' <<< "$PR_LABELS"; then
              spec=true
            fi
            if grep -q 'try-runtime:skip-idempotency' <<< "$PR_LABELS"; then
              idemp=true
            fi
          fi
          echo "disable_spec=$spec" >> "$GITHUB_OUTPUT"
          echo "disable_idemp=$idemp" >> "$GITHUB_OUTPUT"

      - name: Set up Try Runtime CLI
        env:
          TRY_RUNTIME_VERSION: "0.8.0"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/paritytech/try-runtime-cli/releases/download/v${TRY_RUNTIME_VERSION}/try-runtime-x86_64-unknown-linux-musl" \
            --output try-runtime
          chmod +x try-runtime
          mv try-runtime /usr/local/bin/try-runtime

      - name: Build runtime
        uses: hack-ink/polkadot-runtime-releaser/action/build@v0.2.0
        with:
          runtime: ${{ matrix.runtime.name }}
          features: try-runtime
          toolchain-ver: 1.82.0
          output-dir: .

      - name: Try Runtime
        timeout-minutes: 30
        env:
          DISABLE_IDEMP: ${{ steps.flags.outputs.disable_idemp }}
          DISABLE_SPEC: ${{ steps.flags.outputs.disable_spec }}
          RUNTIME_NAME: ${{ matrix.runtime.name }}
          TRY_RUNTIME_URI: ${{ matrix.runtime.uri }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          runtime_files=(*_runtime-*.compact.compressed.wasm)
          if [[ ${#runtime_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one runtime Wasm artifact, found ${#runtime_files[@]}."
            exit 1
          fi

          mkdir -p out
          args=(
            --runtime "${runtime_files[0]}"
            on-runtime-upgrade
            --blocktime 6000
          )
          if [[ "$DISABLE_SPEC" == "true" ]]; then
            args+=(--disable-spec-version-check)
          fi
          if [[ "$DISABLE_IDEMP" == "true" ]]; then
            args+=(--disable-idempotency-checks)
          fi
          args+=(live -u "$TRY_RUNTIME_URI")

          result_log="out/try-runtime-${RUNTIME_NAME}.log"
          : > "$result_log"
          for attempt in 1 2; do
            attempt_log="out/try-runtime-${RUNTIME_NAME}-attempt-${attempt}.log"
            set +e
            try-runtime "${args[@]}" 2>&1 | tee "$attempt_log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e

            status="${pipeline_status[0]}"
            if [[ "$status" -eq 0 && "${pipeline_status[1]}" -ne 0 ]]; then
              status="${pipeline_status[1]}"
            fi
            {
              echo "### Attempt ${attempt}"
              cat "$attempt_log"
            } >> "$result_log"

            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]] ||
              ! grep -Eq 'status_code: 5[0-9]{2}' "$attempt_log"; then
              exit "$status"
            fi

            echo "::warning::Try Runtime received a remote HTTP 5xx response; retrying once."
            sleep 15
          done

      - name: Collect summary
        if: always()
        run: |
          mkdir -p out
          {
            echo "### Try Runtime Result"
            echo "- PR: #$PR_NUMBER"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Runtime: \`${{ matrix.runtime.name }}\`"
            echo "- URI: \`${{ matrix.runtime.uri }}\`"
            echo "- Disable spec-version check: \`${{ steps.flags.outputs.disable_spec }}\`"
            echo "- Disable idempotency checks: \`${{ steps.flags.outputs.disable_idemp }}\`"
            echo "- Conclusion: **${{ job.status }}**"
          } > "out/summary-${{ matrix.runtime.name }}.md"

      - name: Upload artifacts (fallback for forks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: try-runtime-${{ env.PR_NUMBER }}-${{ matrix.runtime.name }}
          path: out/

  report:
    if: >
      always() &&
      (inputs.pr_number != '' ||
      contains(github.event.pull_request.labels.*.name, 'try-runtime'))
    needs: try-runtime
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      DISABLE_IDEMP: ${{ inputs.disable_idempotency_checks || contains(github.event.pull_request.labels.*.name, 'try-runtime:skip-idempotency') }}
      DISABLE_SPEC: ${{ inputs.disable_spec_version_check || contains(github.event.pull_request.labels.*.name, 'try-runtime:skip-spec-check') }}
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      RESULT: ${{ needs.try-runtime.result }}
      TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Post result to PR
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### 🧪 Try Runtime Results',
              '',
              `- PR: #${process.env.PR_NUMBER}`,
              `- Commit: \`${process.env.TARGET_SHA}\``,
              '- Runtime: `darwinia-runtime`',
              `- Disable spec-version check: \`${process.env.DISABLE_SPEC}\``,
              `- Disable idempotency checks: \`${process.env.DISABLE_IDEMP}\``,
              `- Conclusion: **${process.env.RESULT}**`,
              `- [Workflow run](${runUrl})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body
            });

      - name: Remove trigger labels
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const triggerLabels = new Set([
              'try-runtime',
              'try-runtime:skip-spec-check',
              'try-runtime:skip-idempotency'
            ]);
            const labels = context.payload.pull_request.labels
              .map((label) => label.name)
              .filter((name) => triggerLabels.has(name));

            for (const name of labels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(process.env.PR_NUMBER),
                  name
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
